<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="orbGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347" />
      <stop offset="45%" stop-color="#FF4D6D" />
      <stop offset="100%" stop-color="#9B6DFF" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4D8DFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A8E063" stop-opacity="0.9" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="#FFF8F0" />
  <!-- Outer subtle focus ring -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.65" />
  <!-- Central vibrant AI Orb -->
  <circle cx="64" cy="64" r="36" fill="url(#orbGlow)" filter="url(#softGlow)" />
  <!-- Inner productivity geometric icon: stylized modern Z -->
  <path d="M52 48 L76 48 L52 80 L76 80" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="76" cy="48" r="3.5" fill="#FFFDF8" />
  <circle cx="52" cy="80" r="3.5" fill="#FFFDF8" />
</svg>
