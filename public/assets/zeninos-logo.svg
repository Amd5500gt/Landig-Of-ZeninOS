<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="zeninGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347" />
      <stop offset="42%" stop-color="#FF4D6D" />
      <stop offset="100%" stop-color="#9B6DFF" />
    </linearGradient>
    <linearGradient id="zeninGradSecondary" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4D8DFF" />
      <stop offset="100%" stop-color="#A8E063" />
    </linearGradient>
    <filter id="zeninGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient outer rounded backdrop -->
  <rect width="160" height="160" rx="36" fill="#FFF8F0" />

  <!-- Outer focus ring dashed orbit -->
  <circle
    cx="80"
    cy="80"
    r="64"
    fill="none"
    stroke="url(#zeninGradSecondary)"
    stroke-width="2.5"
    stroke-dasharray="10 5"
    opacity="0.6"
  />

  <!-- Inner dynamic energy orbit -->
  <circle
    cx="80"
    cy="80"
    r="52"
    fill="none"
    stroke="url(#zeninGradPrimary)"
    stroke-width="1.5"
    stroke-dasharray="4 6"
    opacity="0.5"
  />

  <!-- Central luminous AI orb -->
  <circle
    cx="80"
    cy="80"
    r="44"
    fill="url(#zeninGradPrimary)"
    filter="url(#zeninGlow)"
  />

  <!-- Geometric stylized Zenin 'Z' mark -->
  <path
    d="M 64 62 L 96 62 L 64 98 L 96 98"
    stroke="#FFFFFF"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Active status pulse dots -->
  <circle cx="96" cy="62" r="4" fill="#FFFDF8" />
  <circle cx="64" cy="98" r="4" fill="#A8E063" />
</svg>
